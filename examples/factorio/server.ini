# server 端配置（公网机器）：互联网客户端连 34197 即可
[server]
# 监听地址，0.0.0.0 表示全部网卡
bind = 0.0.0.0
# 控制端口：client 在此做握手/心跳并回传转发结果
control_port = 34198
# 数据端口：factorio 默认端口，互联网客户端把业务报文发到这里
data_port = 34197
# 超过这么多秒没有收到 client 的握手，就清除其控制地址（默认 180）
client_idle_timeout = 180

[key]
# 预共享密钥，server 与 client 必须一致。64 个 hex 字符 = 32 字节随机密钥（openssl rand -hex 32 生成）
psk = b5501a20265060bdf7a728e439ad4174cb743cd66f9114e6ed9cb6a50e3296e4
