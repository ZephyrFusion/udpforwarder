# Server config (public machine): internet clients just connect to 34197.
[server]
# Listen address; 0.0.0.0 means all interfaces.
bind = 0.0.0.0
# Control port: the client handshakes/heartbeats here and returns forwarded data.
control_port = 34198
# Data port: factorio's default port, where internet clients send their traffic.
data_port = 34197
# Forget the client control address after this many seconds without a handshake
# (default 180).
client_idle_timeout = 180

[key]
# Pre-shared key; must match on both ends. 64 hex chars = 32-byte random key
# (generate with openssl rand -hex 32).
psk = b5501a20265060bdf7a728e439ad4174cb743cd66f9114e6ed9cb6a50e3296e4
