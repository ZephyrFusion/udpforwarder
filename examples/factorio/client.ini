# client 端配置（位于 NAT 之后）
[client]
# server 的公网 ipv4 地址（只支持点分十进制 ipv4，不支持域名）
server_host = 45.62.118.101
# server 的控制端口，与 server.ini 的 control_port 一致
server_control_port = 34198
# 本地 UDP 服务地址，转发的终点（factorio 默认端口）
local_service_host = 127.0.0.1
local_service_port = 34197
# 心跳（握手）间隔，秒，默认 30
heartbeat_interval = 30
# 映射空闲多久后清除，秒，默认 120
mapping_idle_timeout = 120
# 最多同时维护多少个映射，默认 1024
max_mappings = 1024

[key]
# 与 server.ini 的 psk 一致。64 个 hex 字符 = 32 字节随机密钥
psk = b5501a20265060bdf7a728e439ad4174cb743cd66f9114e6ed9cb6a50e3296e4
