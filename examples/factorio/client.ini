# Client config (runs behind NAT).
[client]
# Public IPv4 address of the server (dotted decimal IPv4 only, no hostnames).
server_host = 45.62.118.101
# Control port of the server; must match control_port in server.ini.
server_control_port = 34198
# Local UDP service address: the destination of the forwarding (factorio default port).
local_service_host = 127.0.0.1
local_service_port = 34197
# Heartbeat (handshake) interval in seconds, default 30.
heartbeat_interval = 30
# Drop a mapping after this many idle seconds, default 120.
mapping_idle_timeout = 120
# Max number of mappings kept at the same time, default 1024.
max_mappings = 1024

[key]
# Must match the psk in server.ini. 64 hex chars = 32-byte random key.
psk = b5501a20265060bdf7a728e439ad4174cb743cd66f9114e6ed9cb6a50e3296e4
