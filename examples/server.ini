# server 端配置
[server]
# 监听地址，0.0.0.0 表示全部网卡
bind = 0.0.0.0
# 控制端口：client 在此做握手/心跳并回传转发结果
control_port = 7000
# 数据端口：互联网客户端把业务报文发到这里
data_port = 7001
# 超过这么多秒没有收到 client 的握手，就清除其控制地址（默认 180）
client_idle_timeout = 180

[key]
# 预共享密钥，server 与 client 必须一致。
# 64 个 hex 字符 = 32 字节随机密钥（推荐，用 openssl rand -hex 32 生成）；
# 也可以写至少 16 个字符的口令，会经 blake2b 拉长成 32 字节。
psk = 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
