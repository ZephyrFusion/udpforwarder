# Server config (machine with a public address).
[server]
# Listen address; 0.0.0.0 means all interfaces.
bind = 0.0.0.0
# Control port: the client handshakes/heartbeats here and returns forwarded data.
control_port = 7000
# Data port: internet clients send their traffic here.
data_port = 7001
# Forget the client control address after this many seconds without a handshake
# (default 180).
client_idle_timeout = 180

[key]
# Pre-shared key; must match on both ends.
# 64 hex chars = 32-byte random key (recommended, generate with openssl rand -hex 32);
# otherwise a passphrase of at least 16 chars, stretched to 32 bytes with blake2b.
psk = 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
