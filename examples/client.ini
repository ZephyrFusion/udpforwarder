# Client config (runs behind NAT).
[client]
# Public IPv4 address of the server (dotted decimal IPv4 only, no hostnames).
server_host = 203.0.113.10
# Control port of the server.
server_control_port = 7000
# Local UDP service address: the destination of the forwarding.
local_service_host = 127.0.0.1
local_service_port = 53
# Heartbeat (handshake) interval in seconds, default 30.
heartbeat_interval = 30
# Drop a mapping after this many idle seconds, default 120.
mapping_idle_timeout = 120
# Max number of mappings kept at the same time, default 1024.
max_mappings = 1024

[key]
psk = 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
